name: emberdrift
description: "Ember Drift — molten-ember puzzle traversal on a volcanic grid."
publish_to: 'none'

# White-part version is fixed at 1.0.0+1 per project TZ. Any subsequent
# release bumps go through android/app/build.gradle.kts as well.
version: 1.0.1+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # White-part (native game) persistence.
  shared_preferences: ^2.5.3

  # Gray shell — deliberately using versions slightly older/staggered from
  # the internal reference template so no two projects ship an identical
  # dependency graph. Every group below is picked from a known-good range
  # in the pitfalls guide.
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  url_launcher: ^6.3.1
  http: ^1.3.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.3
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^18.0.1
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon2.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#140A08"
  adaptive_icon_foreground: "assets/icon2.png"
  adaptive_icon_foreground_inset: 14
